<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieDesk</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(17, 24, 39, 0.9);
      --panel-2: rgba(15, 23, 42, 0.9);
      --line: rgba(255,255,255,0.08);
      --text: #ecf2ff;
      --muted: #a8b3c7;
      --primary: #4f8cff;
      --primary-2: #7c5cff;
      --success: #1fd08a;
      --warning: #ffb648;
      --danger: #ff5d74;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(79,140,255,0.18), transparent 25%),
        radial-gradient(circle at bottom right, rgba(124,92,255,0.18), transparent 30%),
        var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .app {
      width: min(1440px, 100%);
      height: min(920px, calc(100vh - 60px));
      background: rgba(11,16,32,0.78);
      border: 1px solid var(--line);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.32);
      display: grid;
      grid-template-rows: 76px 1fr;
      backdrop-filter: blur(12px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px 0 26px;
      background: rgba(13,18,31,0.88);
      border-bottom: 1px solid var(--line);
    }

    .window-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot.red { background: #ff5f57; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #28c840; }

    .title {
      font-size: 0.96rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-left: 18px;
      font-weight: 600;
    }

    .search-wrap {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 0 24px;
    }

    .search {
      width: min(540px, 100%);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 999px;
      display: flex;
      align-items: center;
      padding: 10px 16px;
      gap: 10px;
      color: var(--muted);
    }

    .search input {
      flex: 1;
      background: transparent;
      border: 0;
      outline: none;
      color: var(--text);
      font-size: 0.96rem;
    }

    .search input::placeholder {
      color: var(--muted);
    }

    .user {
      min-width: 150px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f8cff, #7c5cff);
      display: grid;
      place-items: center;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(79,140,255,0.35);
    }

    .user-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .content {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 0;
    }

    .sidebar {
      background: rgba(9,15,29,0.82);
      border-right: 1px solid var(--line);
      padding: 18px 14px 12px;
      overflow: auto;
    }

    .menu-group {
      margin-bottom: 20px;
    }

    .menu-label {
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0 12px 8px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      margin: 6px 0;
      border-radius: 12px;
      color: #dfe8ff;
      cursor: pointer;
      transition: 0.2s ease;
      border: 1px solid transparent;
    }

    .menu-item:hover {
      background: rgba(255,255,255,0.03);
      border-color: rgba(255,255,255,0.04);
    }

    .menu-item.active {
      background: linear-gradient(135deg, rgba(79,140,255,0.18), rgba(124,92,255,0.12));
      border-color: rgba(120,162,255,0.4);
      box-shadow: inset 0 0 0 1px rgba(120,162,255,0.25);
    }

    .icon {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.04);
      font-size: 0.8rem;
      color: #cfe2ff;
    }

    .main {
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 18px;
      padding: 20px 20px 18px;
      overflow: hidden;
    }

    .hero {
      position: relative;
      min-height: 240px;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(26,35,58,0.85), rgba(11,16,32,0.9)),
        linear-gradient(120deg, rgba(79,140,255,0.3), rgba(16,32,63,0.05));
    }

    .hero-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: end;
      justify-content: space-between;
      padding: 24px 26px;
      background:
        linear-gradient(90deg, rgba(0,0,0,0.72), rgba(0,0,0,0.16) 45%, rgba(0,0,0,0.08)),
        radial-gradient(circle at 68% 30%, rgba(124,92,255,0.7), transparent 24%);
    }

    .hero-copy {
      max-width: 56%;
    }

    .kicker {
      display: inline-block;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #dbe7ff;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.72rem;
      margin-bottom: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2rem, 2.4vw, 3rem);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .hero-sub {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .hero-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 18px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: transform 0.18s ease, opacity 0.18s ease;
      font-size: 0.94rem;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 16px 34px rgba(79,140,255,0.35);
    }

    .ghost-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
    }

    .hero-badge {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      padding: 16px 18px;
      min-width: 220px;
      backdrop-filter: blur(8px);
    }

    .badge-top {
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .rating {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .star {
      color: #ffcc4d;
      font-size: 1.1rem;
    }

    .glass-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    .tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tab {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--muted);
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      transition: 0.2s ease;
      font-weight: 600;
    }

    .tab.active {
      background: rgba(79,140,255,0.18);
      color: #dfeaff;
      border-color: rgba(79,140,255,0.45);
    }

    .view-all {
      color: #dfeaff;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .content-panel {
      display: grid;
      grid-template-columns: minmax(0, 2.5fr) 360px;
      gap: 18px;
      min-height: 0;
    }

    .movie-col {
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-header h3 {
      margin: 0;
      font-size: 1.08rem;
      letter-spacing: -0.02em;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      min-height: 0;
      overflow: auto;
      padding-right: 6px;
    }

    .movie-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    }

    .movie-card:hover {
      transform: translateY(-3px);
      border-color: rgba(79,140,255,0.4);
    }

    .movie-poster {
      height: 210px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #1d4ed8, #7c5cff);
    }

    .movie-poster::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.18) 100%),
        linear-gradient(120deg, rgba(255,255,255,0.18), transparent 30%);
    }

    .poster-2 { background: linear-gradient(135deg, #ec4899, #f59e0b); }
    .poster-3 { background: linear-gradient(135deg, #0ea5e9, #10b981); }
    .poster-4 { background: linear-gradient(135deg, #ef4444, #f97316); }
    .poster-5 { background: linear-gradient(135deg, #8b5cf6, #06b6d4); }
    .poster-6 { background: linear-gradient(135deg, #22c55e, #14b8a6); }

    .play-tag {
      position: absolute;
      left: 12px;
      bottom: 12px;
      padding: 7px 10px;
      background: rgba(0,0,0,0.46);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      font-size: 0.72rem;
      color: #e8f1ff;
      backdrop-filter: blur(8px);
    }

    .info {
      padding: 14px 14px 16px;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .title-card {
      font-size: 1.04rem;
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }

    .desc {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.6;
      margin: 0;
    }

    .right-col {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .player-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 16px 30px rgba(0,0,0,0.2);
    }

    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-bottom: 1px solid var(--line);
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: rgba(0,0,0,0.8);
    }

    .player-info {
      padding: 16px 16px 12px;
    }

    .player-title {
      margin: 0 0 8px;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
    }

    .player-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 10px;
    }

    .tag-inline {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(79,140,255,0.12);
      color: #cfe2ff;
      border: 1px solid rgba(79,140,255,0.25);
      font-size: 0.72rem;
    }

    .watchlist {
      margin-top: 18px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 16px;
    }

    .watchlist h4 {
      margin: 0 0 10px;
      font-size: 0.96rem;
    }

    .mini-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mini-item {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
    }

    .mini-poster {
      width: 52px;
      height: 62px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      flex-shrink: 0;
    }

    .mini-poster.p2 { background: linear-gradient(135deg, #10b981, #06b6d4); }
    .mini-poster.p3 { background: linear-gradient(135deg, #8b5cf6, #ec4899); }

    .mini-info {
      flex: 1;
      min-width: 0;
    }

    .mini-name {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-sub {
      margin-top: 4px;
      font-size: 0.74rem;
      color: var(--muted);
    }

    @media (max-width: 1180px) {
      .content-panel {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      .content {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .movie-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .app {
        height: calc(100vh - 24px);
      }

      .topbar {
        padding-inline: 12px;
      }

      .search-wrap {
        display: none;
      }

      .hero-inner {
        flex-direction: column;
        align-items: flex-start;
        justify-content: end;
      }

      .hero-copy {
        max-width: 100%;
      }

      .movie-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="window-controls">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>

      <div class="title">MovieDesk</div>

      <div class="search-wrap">
        <div class="search">
          <span>⌕</span>
          <input id="searchInput" type="text" placeholder="搜索电影、电视剧、类型" />
        </div>
      </div>

      <div class="user">
        <div class="avatar">J</div>
        <div class="user-name">Jacky</div>
      </div>
    </header>

    <div class="content">
      <aside class="sidebar">
        <div class="menu-group">
          <div class="menu-label">导航</div>

          <div class="menu-item active"><span class="icon">◎</span>首页</div>
          <div class="menu-item"><span class="icon">▣</span>热门</div>
          <div class="menu-item"><span class="icon">★</span>收藏</div>
          <div class="menu-item"><span class="icon">☰</span>分类</div>
        </div>

        <div class="menu-group">
          <div class="menu-label">类型</div>

          <div class="menu-item"><span class="icon">🎬</span>动作</div>
          <div class="menu-item"><span class="icon">🚀</span>科幻</div>
          <div class="menu-item"><span class="icon">💥</span>冒险</div>
          <div class="menu-item"><span class="icon">🎭</span>剧情</div>
        </div>
      </aside>

      <main class="main">
        <section class="hero">
          <div class="hero-inner">
            <div class="hero-copy">
              <div class="kicker">今日推荐</div>
              <h1 id="heroTitle">银河守护者</h1>
              <div class="hero-sub">
                <span>2026</span>
                <span>•</span>
                <span>动作 / 科幻</span>
                <span>•</span>
                <span>2h 18m</span>
              </div>

              <div class="hero-actions">
                <button class="primary-btn" id="watchNowBtn">立即播放</button>
                <button class="ghost-btn" id="infoBtn">详情</button>
              </div>
            </div>

            <div class="hero-badge">
              <div class="badge-top">收藏热度</div>
              <div class="rating">
                <span class="star">★</span>
                <span id="heroRating">9.8</span>
              </div>
            </div>
          </div>
        </section>

        <div class="glass-row">
          <div class="tabs" id="tabs">
            <div class="tab active" data-filter="all">精选</div>
            <div class="tab" data-filter="action">动作</div>
            <div class="tab" data-filter="scifi">科幻</div>
            <div class="tab" data-filter="drama">剧情</div>
            <div class="tab" data-filter="adventure">冒险</div>
          </div>

          <button class="view-all">全部影片</button>
        </div>

        <section class="content-panel">
          <div class="movie-col">
            <div class="section-header">
              <h3>正在热播</h3>
            </div>
            <div class="movie-grid" id="movieGrid"></div>
          </div>

          <aside class="right-col">
            <div class="player-card">
              <div class="video-wrap">
                <video id="videoPlayer" controls playsinline>
                  <source src="https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4"/>
                </video>
              </div>

              <div class="player-info">
                <h3 class="player-title" id="playerTitle">银河守护者</h3>
                <div class="player-meta">
                  <span>2026</span>
                  <span>•</span>
                  <span>动作 / 科幻</span>
                  <span>•</span>
                  <span>2h 18m</span>
                </div>

                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                  <span class="tag-inline">4K</span>
                  <span class="tag-inline">高清</span>
                  <span class="tag-inline">中英双字</span>
                </div>
              </div>
            </div>

            <div class="watchlist">
              <h4>我的收藏</h4>
              <div class="mini-list">
                <div class="mini-item">
                  <div class="mini-poster"></div>
                  <div class="mini-info">
                    <div class="mini-name">深海异域</div>
                    <div class="mini-sub">惊悚 / 1h 42m</div>
                  </div>
                </div>

                <div class="mini-item">
                  <div class="mini-poster p2"></div>
                  <div class="mini-info">
                    <div class="mini-name">末日列车</div>
                    <div class="mini-sub">科幻 / 2h 04m</div>
                  </div>
                </div>

                <div class="mini-item">
                  <div class="mini-poster p3"></div>
                  <div class="mini-info">
                    <div class="mini-name">星河记忆</div>
                    <div class="mini-sub">剧情 / 1h 56m</div>
                  </div>
                </div>
              </div>
            </div>
          </aside>
        </section>
      </main>
    </div>
  </div>

  <script>
    const movies = [
      {
        id: 1,
        title: "银河守护者",
        category: "action",
        year: 2026,
        duration: "2h 18m",
        rating: 9.8,
        desc: "在银河边境，一群特工守护最后一颗生命之星，面对帝国残留势力的全面突袭。",
        source: "https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
        posterClass: "poster-1"
      },
      {
        id: 2,
        title: "时空裂痕",
        category: "scifi",
        year: 2025,
        duration: "1h 52m",
        rating: 9.4,
        desc: "一位天才博士在实验中意外打开时间裂缝，自己的记忆被分成多个平行世界。",
        source: "https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
        posterClass: "poster-2"
      },
      {
        id: 3,
        title: "海岛日记",
        category: "drama",
        year: 2024,
        duration: "1h 48m",
        rating: 8.9,
        desc: "离群的年轻人被困在海岛后，重新认识友情、成长与生命的意义。",
        source: "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
        posterClass: "poster-3"
      },
      {
        id: 4,
        title: "荒野猎人",
        category: "adventure",
        year: 2023,
        duration: "2h 10m",
